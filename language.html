<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Language</title>
<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: white;
    font-family: Arial, sans-serif;
}
.container {
    text-align: center;
}

/* =========================
   ANIMATED TITLE STYLES
========================= */
.title-container {
    position: relative;
    height: 40px; /* Reserves space so page layout doesn't jump */
    margin-bottom: 40px;
}

.animated-title {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    margin: 0;
    font-size: 24px;
    font-weight: 300;
    letter-spacing: 2px;
    white-space: nowrap;
    opacity: 0;
    animation: fadeLang 8s infinite;
}

/* Delay each title so they fade in/out sequentially every 2 seconds */
.animated-title:nth-child(1) { animation-delay: 0s; }
.animated-title:nth-child(2) { animation-delay: 2s; }
.animated-title:nth-child(3) { animation-delay: 4s; }
.animated-title:nth-child(4) { animation-delay: 6s; }

/* 8-second total loop animation keyframes */
@keyframes fadeLang {
    0% { opacity: 0; }
    5% { opacity: 1; }
    25% { opacity: 1; }
    30% { opacity: 0; }
    100% { opacity: 0; }
}

h1.static-title {
    margin-bottom: 40px;
    font-weight: 300;
    letter-spacing: 2px;
}

button {
    display: block;
    width: 220px;
    margin: 15px auto;
    padding: 15px;
    font-size: 18px;
    border: 1px solid #000;
    background: white;
    cursor: pointer;
    transition: 0.3s;
}
button:hover {
    background: black;
    color: white;
}
.hidden {
    display: none;
}
.back {
    margin-top: 25px;
    border: none;
    text-decoration: underline;
    font-size: 14px;
    width: auto;
}
.back:hover {
    background: white;
    color: black;
}
</style>
</head>
<body>

<!-- STEP 1: LANGUAGE -->
<div class="container" id="step-language">
    <!-- Animated Crossfading Titles -->
    <div class="title-container">
        <h1 class="animated-title">Select Your Language</h1>
        <h1 class="animated-title">言語を選択してください</h1>
        <h1 class="animated-title">请选择语言</h1>
        <h1 class="animated-title">언어를 선택하세요</h1>
    </div>

    <button onclick="selectLanguage('en')">English</button>
    <button onclick="selectLanguage('ja')">日本語</button>
    <button onclick="selectLanguage('zh')">中文</button>
    <button onclick="selectLanguage('kr')">한국어</button>
</div>

<!-- STEP 2: GENDER -->
<div class="container hidden" id="step-gender">
    <h1 class="static-title" id="gender-title">Select Your Gender</h1>
    <button onclick="selectGender('male')" id="btn-male">Male</button>
    <button onclick="selectGender('female')" id="btn-female">Female</button>
    <button class="back" onclick="goBack()" id="btn-back">Back</button>
</div>

<script>
// STEP 1: Fill in your real Google Sites URLs below.
// Each language has a male and female link.
const links = {
    en: {
        male:   "https://sites.google.com/view/guideinhotel/english",
        female: "https://sites.google.com/view/femaleinformation/english"
    },
    ja: {
        male:   "https://sites.google.com/view/guideinhotel/%E6%97%A5%E6%9C%AC%E8%AA%9E",
        female: "https://sites.google.com/view/femaleinformation/%E6%97%A5%E6%9C%AC%E8%AA%9E"
    },
    zh: {
        male:   "https://sites.google.com/view/guideinhotel/%E4%B8%AD%E6%96%87",
        female: "https://sites.google.com/view/femaleinformation/%E4%B8%AD%E6%96%87"
    },
    kr: {
        male:   "https://sites.google.com/view/guideinhotel/%EC%96%B8%EC%96%B4",
        female: "https://sites.google.com/view/femaleinformation/%ED%95%9C%EA%B5%AD%EC%96%B4"
    }
};

// Text for the gender screen in each language (so guests understand it)
const genderText = {
    en: { title: "Select Your Gender", male: "Male", female: "Female", back: "Back" },
    ja: { title: "性別を選択してください", male: "男性", female: "女性", back: "戻る" },
    zh: { title: "请选择性别", male: "男", female: "女", back: "返回" },
    kr: { title: "성별을 선택하세요", male: "남성", female: "여성", back: "뒤로" }
};

let selectedLang = null;

function selectLanguage(lang) {
    selectedLang = lang;

    // Update gender screen text to match chosen language
    document.getElementById("gender-title").innerText = genderText[lang].title;
    document.getElementById("btn-male").innerText = genderText[lang].male;
    document.getElementById("btn-female").innerText = genderText[lang].female;
    document.getElementById("btn-back").innerText = genderText[lang].back;

    // Switch screens
    document.getElementById("step-language").classList.add("hidden");
    document.getElementById("step-gender").classList.remove("hidden");
}

function selectGender(gender) {
    if (!selectedLang) return;
    window.location.href = links[selectedLang][gender];
}

function goBack() {
    document.getElementById("step-gender").classList.add("hidden");
    document.getElementById("step-language").classList.remove("hidden");
}
</script>
</body>
</html>
