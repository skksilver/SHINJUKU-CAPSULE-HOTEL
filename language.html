<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Language</title>
<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.container {
    text-align: center;
    width: 100%;
    max-width: 400px;
    transition: opacity 0.4s ease, transform 0.4s ease;
    opacity: 1;
    transform: scale(1) translateY(0);
}

/* =========================
   PAGE TRANSITION CLASSES
========================= */
.container.active {
    opacity: 1;
    transform: scale(1) translateY(0);
    pointer-events: auto;
}

.container.hidden {
    display: none;
    opacity: 0;
    transform: scale(0.95) translateY(10px);
    pointer-events: none;
}

.container.fade-out {
    opacity: 0;
    transform: scale(0.95) translateY(10px);
    pointer-events: none;
}

/* =========================
   ANIMATED TITLE STYLES
========================= */
.title-container {
    position: relative;
    width: 100%;
    height: 40px;
    margin-bottom: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.animated-title {
    position: absolute;
    width: 100%;
    margin: 0;
    text-align: center;
    font-size: 24px;
    font-weight: 300;
    letter-spacing: 2px;
    opacity: 0;
    animation: fadeLang 8s infinite;
}

.animated-title:nth-child(1) { animation-delay: 0s; }
.animated-title:nth-child(2) { animation-delay: 2s; }
.animated-title:nth-child(3) { animation-delay: 4s; }
.animated-title:nth-child(4) { animation-delay: 6s; }

@keyframes fadeLang {
    0% { opacity: 0; }
    5% { opacity: 1; }
    25% { opacity: 1; }
    30% { opacity: 0; }
    100% { opacity: 0; }
}

h1.static-title {
    margin-bottom: 40px;
    font-weight: 300;
    letter-spacing: 2px;
    text-align: center;
}

button {
    display: block;
    width: 220px;
    margin: 15px auto;
    padding: 15px;
    font-size: 18px;
    border: 1px solid #000;
    background: white;
    cursor: pointer;
    transition: 0.3s;
}
button:hover {
    background: black;
    color: white;
}
.back {
    margin-top: 25px;
    border: none;
    text-decoration: underline;
    font-size: 14px;
    width: auto;
}
.back:hover {
    background: white;
    color: black;
}

/* =========================
   OUTRO VIDEO OVERLAY
========================= */
#video-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: black;
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
}

#video-overlay.active {
    opacity: 1;
    pointer-events: auto;
}

#outro-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
</style>
</head>
<body>

<!-- STEP 1: LANGUAGE -->
<div class="container active" id="step-language">
    <div class="title-container">
        <h1 class="animated-title">Select Your Language</h1>
        <h1 class="animated-title">言語を選択してください</h1>
        <h1 class="animated-title">请选择语言</h1>
        <h1 class="animated-title">언어를 선택하세요</h1>
    </div>

    <button onclick="selectLanguage('en')">English</button>
    <button onclick="selectLanguage('ja')">日本語</button>
    <button onclick="selectLanguage('zh')">中文</button>
    <button onclick="selectLanguage('kr')">한국어</button>
</div>

<!-- STEP 2: GENDER -->
<div class="container hidden" id="step-gender">
    <h1 class="static-title" id="gender-title">Select Your Gender</h1>
    <button onclick="selectGender('male')" id="btn-male">Male</button>
    <button onclick="selectGender('female')" id="btn-female">Female</button>
    <button class="back" onclick="goBack()" id="btn-back">Back</button>
</div>

<!-- FULLSCREEN OUTRO VIDEO OVERLAY -->
<div id="video-overlay">
    <video id="outro-video" playsinline muted preload="auto">
        <source src="https://github.com/skksilver/SHINJUKU-CAPSULE-HOTEL/raw/main/1788763122682341.mov" type="video/mp4">
    </video>
</div>

<script>
const links = {
    en: {
        male:   "https://sites.google.com/view/guideinhotel/english",
        female: "https://sites.google.com/view/femaleinformation/english"
    },
    ja: {
        male:   "https://sites.google.com/view/guideinhotel/%E6%97%A5%E6%9C%AC%E8%AA%9E",
        female: "https://sites.google.com/view/femaleinformation/%E6%97%A5%E6%9C%AC%E8%AA%9E"
    },
    zh: {
        male:   "https://sites.google.com/view/guideinhotel/%E4%B8%AD%E6%96%87",
        female: "https://sites.google.com/view/femaleinformation/%E4%B8%AD%E6%96%87"
    },
    kr: {
        male:   "https://sites.google.com/view/guideinhotel/%EC%96%B8%EC%96%B4",
        female: "https://sites.google.com/view/femaleinformation/%ED%95%9C%EA%B5%AD%EC%96%B4"
    }
};

const genderText = {
    en: { title: "Select Your Gender", male: "Male", female: "Female", back: "Back" },
    ja: { title: "性別を選択してください", male: "男性", female: "女性", back: "戻る" },
    zh: { title: "请选择性别", male: "男", female: "女", back: "返回" },
    kr: { title: "성별을 선택하세요", male: "남성", female: "여성", back: "뒤로" }
};

let selectedLang = null;
const video = document.getElementById("outro-video");
const overlay = document.getElementById("video-overlay");

// Preload video buffer immediately on load
window.addEventListener("load", () => {
    video.load();
});

function selectLanguage(lang) {
    selectedLang = lang;

    document.getElementById("gender-title").innerText = genderText[lang].title;
    document.getElementById("btn-male").innerText = genderText[lang].male;
    document.getElementById("btn-female").innerText = genderText[lang].female;
    document.getElementById("btn-back").innerText = genderText[lang].back;

    const stepLang = document.getElementById("step-language");
    const stepGender = document.getElementById("step-gender");

    stepLang.classList.add("fade-out");

    setTimeout(() => {
        stepLang.classList.remove("active", "fade-out");
        stepLang.classList.add("hidden");

        stepGender.classList.remove("hidden");
        void stepGender.offsetWidth; 
        stepGender.classList.add("active");
    }, 350);
}

function selectGender(gender) {
    if (!selectedLang) return;

    const destinationUrl = links[selectedLang][gender];

    // Show black background overlay immediately
    overlay.classList.add("active");

    let redirected = false;
    function navigate() {
        if (!redirected) {
            redirected = true;
            window.location.href = destinationUrl;
        }
    }

    // Direct synchronous playback call right inside user click event
    video.currentTime = 0;
    const playPromise = video.play();

    if (playPromise !== undefined) {
        playPromise.then(() => {
            // Video started successfully! Redirect when it finishes.
            video.onended = navigate;
        }).catch(err => {
            // Browser strictly blocked video decoding/playback; redirect directly
            console.warn("Video playback bypassed by browser policies:", err);
            navigate();
        });
    } else {
        video.onended = navigate;
    }

    // Safety fallback timer if video hangs
    setTimeout(navigate, 4000);
}

function goBack() {
    const stepLang = document.getElementById("step-language");
    const stepGender = document.getElementById("step-gender");

    stepGender.classList.remove("active");
    stepGender.classList.add("fade-out");

    setTimeout(() => {
        stepGender.classList.remove("fade-out");
        stepGender.classList.add("hidden");

        stepLang.classList.remove("hidden");
        void stepLang.offsetWidth;
        stepLang.classList.add("active");
    }, 350);
}
</script>
</body>
</html>
